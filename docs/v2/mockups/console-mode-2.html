<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console Mode 2 Alpha — mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=block" rel="stylesheet">
<style>
/* Console Mode 2 Alpha · TV mockup inspired by Selene (mattxslv/Selene, MIT): full-bleed art, LB/RB pill tabs,
 * one row of cards, icon guide menu, option lists. Art comes from the owner's own Steam cache (not committed). */
:root {
  --page-ink: oklch(92% 0.01 260);
  --page-mute: oklch(66% 0.01 260);
  --page-line: oklch(30% 0.01 260);
  --page-chip: oklch(22% 0.01 260);
  --page-bg: oklch(13% 0.01 260);

  --ink: oklch(97% 0.005 250);
  --mute: oklch(80% 0.01 250);
  --dim: oklch(66% 0.012 250);
  --panel: oklch(24% 0.02 255 / .78);
  --panel-solid: oklch(22% 0.02 255);
  --scrim: oklch(8% 0.01 255 / .72);
  --focus: oklch(98% 0 0);
  --accent: oklch(82% 0.08 245);          /* lua: azul claro */
  --accent-ink: oklch(20% 0.03 250);
  --font: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --ease-out: cubic-bezier(.2,.7,.2,1);
}
:root[data-theme="ambar"] { --accent: oklch(82% 0.12 75); --accent-ink: oklch(22% 0.04 60); }
:root[data-theme="jade"] { --accent: oklch(80% 0.11 165); --accent-ink: oklch(20% 0.04 165); }

* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
body { color: var(--page-ink); font-family: var(--font); display: flex; flex-direction: column; }
.standalone, .standalone body { background: var(--page-bg); }
.ms { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; font-feature-settings: "liga"; -webkit-font-smoothing: antialiased; }

/* page bar (outside the TV) */
.bar { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--page-line); }
.bar h1 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; }
.seg { display: flex; gap: 4px; background: var(--page-chip); padding: 4px; border-radius: 10px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; cursor: pointer; font: 14px var(--font); color: var(--page-mute); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--page-ink); color: var(--page-bg); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar .note { font-size: 13px; color: var(--page-mute); }

.viewport { display: grid; place-items: center; padding: 16px; }
.fit { position: relative; width: 100%; max-width: 1600px; aspect-ratio: 16 / 9; }
.stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: oklch(12% 0.01 255); color: var(--ink); font-family: var(--font); border-radius: 4px; }

/* background art */
.bg, .bg-next { position: absolute; inset: 0; background-size: cover; background-position: center top; transition: opacity 420ms var(--ease-out); }
.bg-next { opacity: 0; }
.shade { position: absolute; inset: 0; background:
  linear-gradient(90deg, oklch(10% 0.01 255 / .88) 0%, oklch(10% 0.01 255 / .55) 38%, oklch(10% 0.01 255 / 0) 70%),
  linear-gradient(0deg, oklch(10% 0.01 255 / .9) 0%, oklch(10% 0.01 255 / 0) 45%); }
.layer { position: absolute; inset: 0; }
.hidden { display: none !important; }

/* top bar */
.top { position: absolute; left: 0; right: 0; top: 40px; height: 64px; display: flex; justify-content: center; align-items: center; }
.tabs { display: flex; align-items: center; gap: 10px; font-size: 26px; }
.tab { padding: 10px 26px; border-radius: 999px; color: var(--mute); }
.tab.cur { background: oklch(100% 0 0 / .88); color: oklch(15% 0.01 255); font-weight: 600; }
.bumper { font-size: 15px; font-weight: 700; padding: 5px 10px; border-radius: 8px; background: oklch(100% 0 0 / .9); color: oklch(15% 0.01 255); }
.top-right { position: absolute; right: 70px; display: flex; align-items: center; gap: 26px; font-size: 38px; font-variant-numeric: tabular-nums; }
.top-right .pad-stat { display: flex; align-items: center; gap: 8px; font-size: 22px; color: var(--mute); }
.top-right .pad-stat .ms { font-size: 34px; }

/* hero */
.hero { position: absolute; left: 110px; top: 210px; width: 900px; }
.hero .logo { height: 230px; display: flex; align-items: flex-end; margin-bottom: 34px; }
.hero .logo img { max-height: 230px; max-width: 680px; object-fit: contain; object-position: left bottom; filter: drop-shadow(0 6px 24px oklch(0% 0 0 / .5)); }
.hero .logo .word { white-space: nowrap; font-size: 88px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.hero .logo .word .ms { font-size: 96px; vertical-align: -12px; margin-right: 20px; color: var(--accent); }
.meta { display: flex; gap: 0; }
.meta > div { padding: 0 30px; border-left: 1px solid oklch(100% 0 0 / .22); }
.meta > div:first-child { padding-left: 0; border-left: 0; }
.meta .k { font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
.meta .v { font-size: 26px; font-weight: 600; white-space: nowrap; }
.sub { margin-top: 22px; font-size: 22px; color: var(--mute); max-width: 760px; line-height: 1.4; }

/* card row */
.row { position: absolute; left: 0; right: 0; top: 590px; height: 300px; }
.track { position: absolute; left: 110px; top: 0; display: flex; gap: 18px; align-items: center; height: 100%; transition: transform 260ms var(--ease-out); }
.card { flex: none; width: 168px; height: 252px; border-radius: 10px; overflow: hidden; position: relative; background: var(--panel-solid); transition: transform 180ms var(--ease-out); box-shadow: 0 10px 30px oklch(0% 0 0 / .45); }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card.is-focus { transform: scale(1.14); outline: 4px solid var(--focus); outline-offset: 4px; z-index: 2; }
.card.launcher { display: flex; flex-direction: column; justify-content: space-between; padding: 20px 18px; background-size: cover; background-position: center; }
.card.launcher::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, oklch(20% 0.02 255 / .35), oklch(14% 0.02 255 / .9)); }
.card.launcher > * { position: relative; }
.card.launcher .ms { font-size: 54px; color: var(--accent); }
.card.launcher .appicon { width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 4px 12px oklch(0% 0 0 / .4)); }
.hero .logo .word .appicon { width: 96px; height: 96px; object-fit: contain; vertical-align: -14px; margin-right: 24px; }
.plat { width: 1.05em; height: 1.05em; object-fit: contain; vertical-align: -0.17em; margin-right: 8px; }
.card.launcher .nm { font-size: 21px; font-weight: 600; line-height: 1.2; }
.card.launcher .nm small { display: block; font-size: 15px; font-weight: 400; color: var(--mute); margin-top: 4px; }
.card.add { background: transparent; box-shadow: none; border: 2px dashed oklch(100% 0 0 / .35); }
.card.add::before { display: none; }
.card.add .ms { color: var(--mute); }
.row-label { position: absolute; left: 110px; top: 556px; font-size: 18px; color: var(--mute); font-weight: 600; letter-spacing: .04em; }
.gap { flex: none; width: 26px; }

/* hint bar */
.hints { position: absolute; left: 70px; right: 70px; bottom: 44px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; }
.hints .grp { display: flex; gap: 40px; align-items: center; }
.hint { display: flex; align-items: center; gap: 12px; }
.hint small { display: block; font-size: 15px; color: var(--mute); margin-top: 2px; }
.btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: oklch(100% 0 0 / .92); color: oklch(15% 0.01 255); font-size: 16px; font-weight: 700; flex: none; }
.btn .ms { font-size: 22px; }

/* centered option list (Sessão, Sistema, Opções) */
.sheet { position: absolute; left: 50%; top: 150px; width: 880px; transform: translateX(-50%); }
.sheet .eyebrow { font-size: 17px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin: 0 0 6px 6px; }
.sheet h2 { font-size: 46px; font-weight: 600; margin: 0 0 22px 4px; }
.opt { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; align-items: center; gap: 18px; min-height: 76px; padding: 14px 26px; margin-bottom: 10px; background: var(--panel); border-radius: 10px; backdrop-filter: blur(18px); }
.opt .ms { font-size: 30px; color: var(--accent); }
.opt .t { font-size: 24px; font-weight: 600; }
.opt .d { font-size: 17px; color: var(--mute); margin-top: 3px; }
.opt .val { font-size: 20px; color: var(--mute); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.opt .val .ms { color: var(--mute); font-size: 26px; }
.opt.is-focus { outline: 3px solid var(--focus); outline-offset: -1px; }
.toggle { width: 54px; height: 30px; border-radius: 999px; background: oklch(100% 0 0 / .22); position: relative; }
.toggle::after { content: ""; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); transition: transform 160ms var(--ease-out); }
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(24px); background: var(--accent-ink); }
.dimmed { position: absolute; inset: 0; background: var(--scrim); }

/* card options: compact menu beside the held card */
.track.ctx-open .card:not(.held) { opacity: .4; }
.card.held { transform: scale(1.14); outline: 4px solid var(--focus); outline-offset: 4px; z-index: 2; }
.ctx { position: absolute; width: 560px; padding: 12px; border-radius: 18px; background: oklch(20% 0.02 255 / .9); backdrop-filter: blur(24px); box-shadow: 0 30px 80px oklch(0% 0 0 / .55), 0 0 0 1px oklch(100% 0 0 / .08); }
.ctx .hd { padding: 14px 18px 16px; margin-bottom: 8px; border-bottom: 1px solid oklch(100% 0 0 / .1); }
.ctx .hd .t { font-size: 28px; font-weight: 600; }
.ctx .hd .d { font-size: 18px; color: var(--mute); margin-top: 4px; }
.ctx-item { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 12px; font-size: 24px; }
.ctx-item > .ms:first-child { font-size: 28px; color: var(--accent); }
.ctx-item .r { font-size: 19px; color: var(--mute); display: flex; align-items: center; }
.ctx-item .r .ms { font-size: 26px; }
.ctx-item.is-focus { background: oklch(100% 0 0 / .14); box-shadow: 0 0 0 2px oklch(100% 0 0 / .92); }
.ctx-h { font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); padding: 6px 18px 4px; }
.ctx-item .r.changed { color: var(--accent); }
.ctx-sep { height: 1px; margin: 6px 12px; background: oklch(100% 0 0 / .1); }

/* settings, PS4/PS5 style: plain dark backdrop, category list, then sub-sections | options */
.sbg { position: absolute; inset: 0; background:
  radial-gradient(70% 60% at 12% 0%, color-mix(in oklch, var(--accent) 16%, transparent), transparent 70%),
  linear-gradient(180deg, oklch(17% 0.015 255), oklch(11% 0.01 255)); }
.st-title { position: absolute; left: 110px; top: 150px; display: flex; align-items: center; gap: 18px; font-size: 44px; font-weight: 600; }
.st-title .ms { font-size: 46px; color: var(--accent); }
.st-title .crumb { color: var(--mute); font-weight: 400; }
.st-title .crumb::after { content: "›"; margin: 0 14px; }
.st-sub.is-focus, .st-row.is-focus, .cat.is-focus { background: oklch(100% 0 0 / .14); box-shadow: 0 0 0 2px oklch(100% 0 0 / .92), 0 0 30px oklch(100% 0 0 / .16); color: var(--ink); }
.st-left { position: absolute; left: 110px; top: 250px; width: 470px; display: flex; flex-direction: column; gap: 6px; }
.st-sub { font-size: 27px; padding: 18px 26px; border-radius: 12px; color: var(--mute); }
.st-sub.sel { color: var(--ink); background: oklch(100% 0 0 / .06); }
.st-right { position: absolute; left: 640px; right: 110px; top: 250px; bottom: 140px; border-left: 1px solid oklch(100% 0 0 / .1); padding-left: 46px; }
.st-h { font-size: 18px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin: 6px 0 12px 26px; }
.st-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 24px; align-items: center; min-height: 88px; padding: 16px 26px; border-radius: 12px; margin-bottom: 4px; }
.st-row .t { font-size: 27px; }
.st-row .d { font-size: 19px; color: var(--mute); margin-top: 4px; }
.st-row .val { font-size: 24px; }
.cat-list { position: absolute; left: 110px; top: 250px; width: 800px; display: flex; flex-direction: column; gap: 4px; }
.cat { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; align-items: center; gap: 18px; padding: 15px 26px; border-radius: 12px; font-size: 28px; }
.cat > .ms:first-child { font-size: 34px; color: var(--accent); }
.cat .chev { font-size: 30px; color: var(--dim); }
.cat-desc { position: absolute; left: 1040px; right: 110px; top: 280px; }
.cat-desc > .ms { font-size: 150px; color: oklch(100% 0 0 / .13); }
.cat-desc h3 { font-size: 40px; font-weight: 600; margin: 18px 0 10px; }
.cat-desc p { font-size: 25px; color: var(--mute); line-height: 1.45; margin: 0; max-width: 640px; }

/* guide menu (in session) */
.guide { position: absolute; left: 0; right: 0; bottom: 120px; display: flex; justify-content: center; gap: 26px; }
.gbtn { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; position: relative; transition: transform 160ms var(--ease-out); }
.gbtn .ms { font-size: 40px; }
.gbtn.is-focus { outline: 3px solid var(--focus); background: oklch(100% 0 0 / .12); transform: scale(1.08); }
.gbtn .lbl { position: absolute; bottom: 104px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 600; white-space: nowrap; opacity: 0; }
.gbtn.is-focus .lbl { opacity: 1; }
.gbtn.danger .ms { color: var(--accent); }
.now { position: absolute; left: 110px; top: 150px; }
.now img { max-height: 160px; max-width: 760px; object-fit: contain; }
.now .k { margin-top: 26px; }
.panelbox { position: absolute; left: 50%; bottom: 260px; transform: translateX(-50%); width: 760px; background: var(--panel); backdrop-filter: blur(18px); border-radius: 14px; padding: 26px 30px; }
.panelbox h3 { margin: 0 0 14px; font-size: 26px; font-weight: 600; }
.vol { display: flex; align-items: center; gap: 18px; font-size: 22px; }
.vol .bar2 { flex: 1; height: 8px; border-radius: 4px; background: oklch(100% 0 0 / .2); position: relative; }
.vol .bar2 i { position: absolute; inset: 0 34% 0 0; border-radius: 4px; background: var(--accent); }

/* launch */
.launch .logo-c { position: absolute; left: 0; right: 0; top: 330px; display: flex; justify-content: center; }
.launch .logo-c img { max-height: 200px; max-width: 760px; object-fit: contain; }
.steps { position: absolute; left: 50%; top: 610px; transform: translateX(-50%); width: 620px; display: flex; flex-direction: column; gap: 14px; font-size: 24px; }
.steps div { display: flex; align-items: center; gap: 16px; color: var(--dim); transition: color 200ms; }
.steps div .ms { font-size: 28px; }
.steps div.done { color: var(--ink); }
.steps div.done .ms { color: var(--accent); }
.toast { position: absolute; left: 50%; top: 60px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; padding: 18px 28px; border-radius: 999px; background: var(--panel); backdrop-filter: blur(18px); font-size: 22px; }

@media (prefers-reduced-motion: reduce) { * { transition-duration: 1ms !important; } }
</style>
</head>

<script>
if (window.self === window.top) document.documentElement.classList.add("standalone");
const ART = {};
for (const i of document.querySelectorAll("#art img")) {
  let s = i.getAttribute("src");
  if (/^[a-z]:\//i.test(s)) s = "file:///" + encodeURI(s);   // opened straight from disk
  ART[i.dataset.k] = s;
}
const art = k => ART[k] || "";

// Last-played times are the real ones from this PC's appmanifest files.
const GAMES = [
  { id: 4115450, name: "Phantom Blade Zero", last: 1793549935 },
  { id: 814380, name: "Sekiro: Shadows Die Twice", last: 1792885204 },
  { id: 292030, name: "The Witcher 3: Wild Hunt", last: 1792461900 },
  { id: 3669870, name: "CONTROL Resonant", last: 1792022717 },
  { id: 374320, name: "DARK SOULS III", last: 1788578313 },
  { id: 3240220, name: "Grand Theft Auto V Enhanced", last: 1765423453 },
];
const LAUNCHERS = [
  { id: "steam", icon: "sports_esports", name: "Steam Big Picture", note: "padrão", sub: "Abre a Steam em tela cheia. Ao fechar, suas telas voltam sozinhas.", bg: "4115450-blur" },
  { id: "playnite", icon: "grid_view", name: "Playnite", note: "tela cheia", sub: "Abre o Playnite em tela cheia. Ao fechar, suas telas voltam sozinhas." },
  { id: "xbox", icon: "stadia_controller", name: "Modo Xbox", note: "experimental", sub: "A experiência de tela cheia do Xbox no Windows." },
];
const SETUP = [["Tela de jogo", "TV da sala"], ["Imagem", "4K · 120 Hz · HDR"], ["Áudio", "TV (HDMI)"]];

const ago = t => {
  const d = Math.max(0, Math.round((Date.now() / 1000 - t) / 86400));
  return d === 0 ? "hoje" : d === 1 ? "ontem" : d < 31 ? `há ${d} dias` : `há ${Math.round(d / 30)} ${Math.round(d / 30) === 1 ? "mês" : "meses"}`;
};
const hint = (b, t, s) => `<span class="hint"><span class="btn">${b}</span><span>${t}${s ? `<small>${s}</small>` : ""}</span></span>`;
const ms = n => `<span class="ms">${n}</span>`;
const clock = () => new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

const SCRS = ["home", "session", "system", "options", "launch", "guide"];
const TABS = ["home", "session", "system"];
let scr = "home", homeIdx = 0, theme = "lua";
try { const s = JSON.parse(localStorage.getItem("cm2-mock2") || "{}"); if (SCRS.includes(s.scr)) scr = s.scr; if (s.theme) theme = s.theme; } catch {}

const items = () => [...LAUNCHERS.map(l => ({ kind: "l", ...l })), { kind: "add" }, ...GAMES.map(g => ({ kind: "g", ...g }))];

function topBar(curTab) {
  return `<div class="top"><div class="tabs"><span class="bumper">LB</span>${["Início", "Sessão", "Sistema"].map((t, i) => `<span class="tab${TABS[i] === curTab ? " cur" : ""}">${t}</span>`).join("")}<span class="bumper">RB</span></div>
    <div class="top-right"><span class="pad-stat">${ms("battery_5_bar")}DualSense</span><span data-clock>${clock()}</span></div></div>`;
}

const V = {
  home() {
    const it = items();
    return `${topBar("home")}
      <div class="hero" id="hero"></div>
      <div class="row"><div class="track" id="track">${it.map((x, i) => {
        if (x.kind === "l") return `<div class="card launcher f" data-i="${i}" ${x.bg ? `style="background-image:url('${art(x.bg)}')"` : ""}><img class="appicon" src="${art("icon-" + x.id)}" alt=""><span class="nm">${x.name}<small>${x.note}</small></span></div>`;
        if (x.kind === "add") return `<div class="card launcher add f" data-i="${i}">${ms("add")}<span class="nm">Adicionar app<small>qualquer programa</small></span></div><div class="gap"></div>`;
        return `<div class="card f" data-i="${i}"><img src="${art(x.id + "-cover")}" alt="${x.name}"></div>`;
      }).join("")}</div></div>
      <div class="hints"><div class="grp">${hint(ms("menu"), "Menu", "Segure: Sistema")}${hint(ms("swap_horiz"), "Trocar tela")}</div>
        <div class="grp">${hint("A", "Jogar")}${hint("Y", "Opções")}</div></div>`;
  },
  session() {
    return `<div class="sbg"></div>${topBar("session")}${twoPane("tune", "", "Sessão", SESSION_SUBS)}
      <div class="hints"><div class="grp">${hint("B", "Voltar")}</div><div class="grp">${hint("A", "Mudar")}</div></div>`;
  },
  system() {
    if (sysCat >= 0) {
      const c = SYS_CATS[sysCat];
      return `<div class="sbg"></div>${topBar("system")}${twoPane(c.icon, "Sistema", c.t, c.subs)}
        <div class="hints"><div class="grp">${hint("B", "Voltar")}</div><div class="grp">${hint("A", "Mudar")}</div></div>`;
    }
    return `<div class="sbg"></div>${topBar("system")}
      <div class="st-title">${ms("settings")}Sistema</div>
      <div class="cat-list">${SYS_CATS.map((c, i) => `<div class="cat f" data-cat="${i}">${ms(c.icon)}<span>${c.t}</span><span class="ms chev">chevron_right</span></div>`).join("")}</div>
      <div class="cat-desc" id="catDesc"></div>
      <div class="hints"><div class="grp">${hint("B", "Voltar")}</div><div class="grp">${hint("A", "Abrir")}</div></div>`;
  },
  // Y on a card: a compact menu beside the card (PS5 style); the Home stays visible behind it.
  options() {
    const g = items()[homeIdx];
    const it = (icon, t, r, act) => `<div class="ctx-item f" data-act="${act}">${ms(icon)}<span>${t}</span><span class="r">${r}</span></div>`;
    // per-game settings live right here; A cycles the value. They apply the next time this game opens.
    const set = (icon, t, vals) => `<div class="ctx-item f" data-act="cycle" data-vals="${vals.join("|")}">${ms(icon)}<span>${t}</span><span class="r">${vals[0]}</span></div>`;
    return V.home().replace(/<div class="hints">[\s\S]*$/, "") + `<div class="ctx" id="ctx">
        <div class="hd"><div class="t">${g.name}</div><div class="d"><img class="plat" src="${art("icon-steam")}" alt="">Steam · última vez ${ago(g.last)}</div></div>
        ${it("play_arrow", "Jogar", "na TV da sala", "play")}
        <div class="ctx-sep"></div>
        <div class="ctx-h">Ao abrir este jogo</div>
        ${set("hdr_on", "HDR", ["Igual à sessão", "Ligado", "Desligado"])}
        ${set("aspect_ratio", "Resolução", ["Igual à sessão", "3840 × 2160", "2560 × 1440", "1920 × 1080"])}
        ${set("speed", "Limite de FPS", ["Igual à sessão", "30", "60", "120", "Sem limite"])}
        ${set("skip_next", "Ir direto para o jogo", ["Ligado", "Desligado"])}
        <div class="ctx-sep"></div>
        ${it("swap_horiz", "Mover na fileira", "", "move")}
        ${it("push_pin", "Fixar na Início", "Desligado", "pin")}
        ${it("visibility_off", "Esconder da Início", "", "hide")}
      </div>
      <div class="hints"><div class="grp">${hint("B", "Fechar")}</div><div class="grp">${hint("A", "Selecionar")}</div></div>`;
  },
  launch() {
    const g = GAMES[0];
    return `<div class="layer launch"><div class="logo-c"><img src="${art(g.id + "-logo")}" alt="${g.name}"></div>
      <div class="steps" id="steps">
        <div>${ms("check_circle")}TV da sala como tela de jogo · 4K 120 Hz</div>
        <div>${ms("check_circle")}Monitor 27" e notebook desligados</div>
        <div>${ms("check_circle")}Áudio na TV (HDMI) · HDR ligado</div>
        <div>${ms("check_circle")}Abrindo ${g.name} pelo Steam Big Picture</div>
      </div></div>`;
  },
  guide() {
    const g = GAMES[0];
    const B = [["play_arrow", "Voltar ao jogo"], ["select_window", "Janelas · 3 abertas"], ["tv", "Tela e som"], ["volume_up", "Volume"], ["speed", "FPS · limite 60"], ["screenshot_monitor", "Visão de tarefas"], ["power_settings_new", "Encerrar sessão", 1]];
    return `<div class="dimmed"></div>
      <div class="now"><img src="${art(g.id + "-logo")}" alt="${g.name}">
        <div class="meta k"><div><div class="k">Jogando há</div><div class="v">1 h 12 min (exemplo)</div></div><div><div class="k">Pelo</div><div class="v">Steam Big Picture</div></div><div><div class="k">Tela</div><div class="v">TV da sala · HDR</div></div></div></div>
      <div class="top"><div class="top-right"><span class="pad-stat">${ms("battery_5_bar")}DualSense</span><span data-clock>${clock()}</span></div></div>
      <div class="panelbox hidden" id="volbox"><h3>Volume · TV (HDMI)</h3><div class="vol">${ms("volume_down")}<div class="bar2"><i></i></div>${ms("volume_up")}<span>66</span></div></div>
      <div class="guide">${B.map(([i, l, d]) => `<div class="gbtn f${d ? " danger" : ""}" data-l="${l}">${ms(i)}<span class="lbl">${l}</span></div>`).join("")}</div>
      <div class="hints"><div class="grp">${hint("B", "Fechar")}</div><div class="grp">${hint("A", "Selecionar")}</div></div>`;
  },
};
function opt(icon, t, d, right) { return `<div class="opt f">${ms(icon)}<div><div class="t">${t}</div>${d ? `<div class="d">${d}</div>` : ""}</div>${right}</div>`; }
const val = (v, c) => `<span class="val">${v}${c ? ms("chevron_right") : ""}</span>`;
const tog = on => `<span class="toggle${on ? " on" : ""}"></span>`;
const chev = () => `<span class="val">${ms("chevron_right")}</span>`;

// PS4/PS5-style settings: a category list, then two panes (sub-sections left, options right).
const R = (t, d, right) => ({ t, d, right });
const v = x => val(x);
const SESSION_SUBS = [
  { t: "Telas", rows: [R("Tela de jogo", "Onde o jogo aparece.", v("TV da sala")), R("Outras telas", "Monitor 27\" e notebook.", v("Desligar na sessão")), R("Confirmar a imagem ao iniciar", "Se você não confirmar, tudo volta sozinho.", tog(true))] },
  { t: "Imagem", rows: [R("Resolução", "Aplicada ao iniciar, desfeita ao encerrar.", v("3840 × 2160")), R("Taxa de atualização", "", v("120 Hz")), R("HDR", "Liga o HDR do Windows só na sessão.", tog(true))] },
  { t: "Som", rows: [R("Saída de áudio", "", v("TV (HDMI)")), R("Voltar para a saída anterior no fim", "", tog(true))] },
  { t: "Desempenho", rows: [R("Limite de FPS", "Via RTSS, quando instalado.", v("60")), R("Mostrar FPS na tela", "", tog(false))] },
  { t: "Ao encerrar", rows: [R("Devolver os ícones da área de trabalho ao lugar", "", tog(true)), R("Fechar o iniciador junto", "", tog(true))] },
];
const SYS_CATS = [
  { icon: "sports_esports", t: "Controles", d: "Layout dos botões, vibração e o controle como mouse.", subs: [
    { t: "Controle", rows: [R("Layout dos botões", "PlayStation ou Xbox, conforme o controle ligado.", v("Automático")), R("Vibrar ao navegar", "", tog(true))] },
    { t: "Mouse pelo controle", rows: [R("Usar o controle como mouse", "Fora dos jogos, com o analógico esquerdo.", tog(false)), R("Velocidade", "", v("Média"))] }] },
  { icon: "gamepad", t: "Atalhos", d: "Combinações que funcionam mesmo com o Console Mode na bandeja.", subs: [
    { t: "Atalhos do controle", rows: [R("Abrir o Console Mode", "", v("Segurar PS / Xbox 1 s")), R("Menu da sessão", "", v("Segurar ☰")), R("Visão de tarefas", "", v("Select + X"))] }] },
  { icon: "volume_up", t: "Som", d: "Sons de navegação e de início de sessão.", subs: [
    { t: "Sons da interface", rows: [R("Sons de navegação", "", tog(true)), R("Estilo", "", v("Console")), R("Volume", "", v("60 %"))] }] },
  { icon: "palette", t: "Aparência", d: "Tema, fundo da Início e tamanho da interface na TV.", subs: [
    { t: "Tema", rows: [R("Tema", "", v("Lua")), R("Fundo da Início", "", v("Arte do item em foco"))] },
    { t: "Tamanho", rows: [R("Escala da interface", "", v("100 %"))] }] },
  { icon: "power_settings_new", t: "Inicialização", d: "Como o Console Mode abre junto com o Windows.", subs: [
    { t: "Inicialização", rows: [R("Iniciar com o Windows", "", tog(false)), R("Começar na bandeja", "Pronto para o atalho do controle.", tog(true))] }] },
  { icon: "system_update", t: "Atualizações", d: "Versão instalada e canal alpha da 2.0.", subs: [
    { t: "Software", rows: [R("Versão", "", v("2.0.0-alpha.1")), R("Canal", "", v("Alpha")), R("Procurar atualização", "", chev())] }] },
  { icon: "translate", t: "Idioma", d: "Idioma da interface.", subs: [
    { t: "Idioma", rows: [R("Idioma", "", v("Português (Brasil)"))] }] },
  { icon: "info", t: "Sobre", d: "Licenças, registros e relatar um problema.", subs: [
    { t: "Sobre", rows: [R("Relatar um problema", "", chev()), R("Abrir a pasta de registros", "", chev()), R("Licenças", "", chev())] }] },
];
let sysCat = -1, lastCat = 0, subIdx = 0;
function twoPane(icon, crumb, title, subs) {
  return `<div class="st-title">${ms(icon)}${crumb ? `<span class="crumb">${crumb}</span>` : ""}${title}</div>
    <div class="st-left">${subs.map((s, i) => `<div class="st-sub f${i === subIdx ? " sel" : ""}" data-sub="${i}">${s.t}</div>`).join("")}</div>
    <div class="st-right" id="stRight">${rowsHtml(subs[subIdx] || subs[0])}</div>`;
}
const rowsHtml = s => `<div class="st-h">${s.t}</div>${s.rows.map(r => `<div class="st-row f"><div><div class="t">${r.t}</div>${r.d ? `<div class="d">${r.d}</div>` : ""}</div>${r.right}</div>`).join("")}`;
const curSubs = () => scr === "session" ? SESSION_SUBS : SYS_CATS[sysCat]?.subs;

const stage = document.getElementById("stage"), ui = document.getElementById("ui"), fit = document.getElementById("fit");
const bg = document.getElementById("bg"), bgn = document.getElementById("bgn");
let bgKey = null;
function setBg(key) {
  if (key === bgKey) return; bgKey = key;
  bgn.style.backgroundImage = key ? `url('${art(key)}')` : "none";
  bgn.style.transition = "none"; bgn.style.opacity = 0; void bgn.offsetWidth;
  bgn.style.transition = ""; bgn.style.opacity = 1;
  clearTimeout(setBg.t); setBg.t = setTimeout(() => { bg.style.backgroundImage = bgn.style.backgroundImage; bgn.style.transition = "none"; bgn.style.opacity = 0; }, 450);
}

let launchTimer = [];
function render() {
  launchTimer.forEach(clearTimeout); launchTimer = [];
  document.documentElement.dataset.theme = theme;
  ui.innerHTML = V[scr]();
  for (const b of document.querySelectorAll("#scrs button")) b.setAttribute("aria-pressed", b.dataset.scr === scr);
  for (const b of document.querySelectorAll("#themes button")) b.setAttribute("aria-pressed", b.dataset.theme === theme);
  document.getElementById("shade").style.display = scr === "launch" ? "none" : "";
  const fs = [...ui.querySelectorAll(".f")];
  if (scr === "home") { focus(fs[homeIdx] || fs[0]); }
  else if (scr === "session" || scr === "system") {
    setBg(null);
    focus(ui.querySelector(`[data-cat="${lastCat}"]`) || ui.querySelector(`[data-sub="${subIdx}"]`) || fs[0]);
  }
  else if (scr === "options") {
    for (const c of ui.querySelectorAll(".card")) c.classList.remove("f");
    showItem(homeIdx);
    const card = ui.querySelector(`.card[data-i="${homeIdx}"]`), track = document.getElementById("track");
    card.classList.add("held"); track.classList.add("ctx-open");
    const shift = -parseFloat((track.style.transform.match(/-?[\d.]+/) || [0])[0]);
    const ctx = document.getElementById("ctx");
    ctx.style.left = Math.min(1920 - 560 - 70, 110 + card.offsetLeft - shift + card.offsetWidth + 40) + "px";
    ctx.style.top = (590 + 300 - ctx.offsetHeight) + "px";
    focus(ctx.querySelector(".f"));
  }
  else {
    setBg(`${GAMES[0].id}-hero`);
    focus(fs[0]);
  }
  if (scr === "launch") {
    const st = [...ui.querySelectorAll("#steps div")];
    st.forEach((d, i) => launchTimer.push(setTimeout(() => d.classList.add("done"), 500 + i * 650)));
    launchTimer.push(setTimeout(() => { scr = "guide"; render(); }, 500 + st.length * 650 + 900));
  }
  try { localStorage.setItem("cm2-mock2", JSON.stringify({ scr, theme })); } catch {}
}
setInterval(() => { for (const c of ui.querySelectorAll("[data-clock]")) c.textContent = clock(); }, 15000);

let cur = null;
function focus(el) {
  if (!el) return;
  cur?.classList.remove("is-focus"); cur = el; el.classList.add("is-focus");
  if (scr === "home" && el.dataset.i !== undefined) showItem(+el.dataset.i);
  if (scr === "guide") document.getElementById("volbox")?.classList.toggle("hidden", el.dataset.l !== "Volume");
  if (el.dataset.sub !== undefined && +el.dataset.sub !== subIdx) {
    subIdx = +el.dataset.sub;
    document.getElementById("stRight").innerHTML = rowsHtml(curSubs()[subIdx]);
    for (const s of ui.querySelectorAll("[data-sub]")) s.classList.toggle("sel", +s.dataset.sub === subIdx);
  }
  if (el.dataset.cat !== undefined) {
    lastCat = +el.dataset.cat;
    const c = SYS_CATS[lastCat];
    document.getElementById("catDesc").innerHTML = `${ms(c.icon)}<h3>${c.t}</h3><p>${c.d}</p>`;
  }
}
function showItem(i) {
  homeIdx = i;
  const x = items()[i], hero = document.getElementById("hero");
  if (x.kind === "g") {
    setBg(`${x.id}-hero`);
    hero.innerHTML = `<div class="logo"><img src="${art(x.id + "-logo")}" alt="${x.name}"></div>
      <div class="meta"><div><div class="k">Última vez</div><div class="v">${ago(x.last)}</div></div><div><div class="k">Abre pelo</div><div class="v"><img class="plat" src="${art("icon-steam")}" alt="">Steam Big Picture</div></div>${SETUP.slice(0, 2).map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>`;
  } else if (x.kind === "l") {
    setBg(x.bg ? x.bg : null);
    hero.innerHTML = `<div class="logo"><span class="word"><img class="appicon" src="${art("icon-" + x.id)}" alt="">${x.name}</span></div>
      <div class="meta">${SETUP.map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div><div class="sub">${x.sub}</div>`;
  } else {
    setBg(null);
    hero.innerHTML = `<div class="logo"><span class="word">${ms("add_circle")}Adicionar app</span></div><div class="sub">Qualquer programa vira um iniciador: emulador, launcher de outra loja, um jogo solto. Ao fechar, suas telas voltam sozinhas.</div>`;
  }
  // keep the focused card in view: scroll the row once focus passes the 5th card
  const track = document.getElementById("track"), card = track.querySelector(`[data-i="${i}"]`);
  const shift = Math.max(0, card.offsetLeft - 4 * 186);
  track.style.transform = `translateX(${-shift}px)`;
}
function move(dx, dy) {
  if (!cur) return;
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bs = Infinity;
  for (const el of ui.querySelectorAll(".f")) {
    if (el === cur) continue;
    const b = el.getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
    const px = (bx - ax) * dx + (by - ay) * dy;
    if (px <= 4) continue;
    const s = px + Math.abs(dx ? by - ay : bx - ax) * 2.5;
    if (s < bs) { bs = s; best = el; }
  }
  focus(best);
}
function go(s) { if (s !== scr) { sysCat = -1; subIdx = 0; } if (s === "options" && items()[homeIdx].kind !== "g") homeIdx = 4; scr = s; render(); }
function tab(d) { const i = TABS.indexOf(scr); go(TABS[((i < 0 ? 0 : i) + d + 3) % 3]); }
function press(k) {
  if (k === "B" && scr === "system" && sysCat >= 0) { sysCat = -1; subIdx = 0; render(); return; }
  if (k === "B" && (scr === "session" || scr === "system") && cur?.classList.contains("st-row")) { focus(ui.querySelector(`[data-sub="${subIdx}"]`)); return; }
  if (k === "A" && cur?.dataset.cat !== undefined) { sysCat = +cur.dataset.cat; subIdx = 0; render(); focus(ui.querySelector('[data-sub="0"]')); return; }
  if (k === "A" && cur?.dataset.sub !== undefined) { focus(ui.querySelector("#stRight .f")); return; }
  if (k === "A") {
    if (scr === "home") go("launch");
    else if (scr === "options" && cur?.dataset.act === "play") go("launch");
    else if (scr === "options" && cur?.dataset.act === "cycle") { const vs = cur.dataset.vals.split("|"), r = cur.querySelector(".r"); r.textContent = vs[(vs.indexOf(r.textContent) + 1) % vs.length]; r.classList.toggle("changed", r.textContent !== vs[0]); }
    else if (scr === "options" && cur?.dataset.act === "pin") { const r = cur.querySelector(".r"); r.textContent = r.textContent === "Ligado" ? "Desligado" : "Ligado"; }
    else if (scr === "guide" && cur?.dataset.l === "Voltar ao jogo") go("home");
    else if (scr === "guide" && cur?.dataset.l === "Encerrar sessão") go("home");
    else cur?.querySelector(".toggle")?.classList.toggle("on");
  }
  if (k === "B") { if (scr !== "home") go("home"); }
  if (k === "Y" && scr === "home" && items()[homeIdx].kind === "g") go("options");
  if (k === "MENU") go(scr === "guide" ? "home" : "guide");
}

addEventListener("keydown", e => {
  if (e.target.closest?.(".bar")) return;
  const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (k) { e.preventDefault(); move(...k); return; }
  const m = { Enter: "A", " ": "A", Escape: "B", Backspace: "B", y: "Y", m: "MENU" }[e.key];
  if (m) { e.preventDefault(); press(m); }
  if (e.key === "q" || e.key === "PageUp") tab(-1);
  if (e.key === "e" || e.key === "PageDown") tab(1);
});
ui.addEventListener("pointerover", e => { const f = e.target.closest(".f"); if (f && f !== cur) focus(f); });
ui.addEventListener("click", e => { const f = e.target.closest(".f"); if (f) { focus(f); press("A"); } });
document.getElementById("scrs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(b.dataset.scr); });
document.getElementById("themes").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { theme = b.dataset.theme; render(); } });

let prev = [], lastMove = 0;
function poll(t) {
  const p = [...(navigator.getGamepads?.() || [])].find(Boolean);
  if (p) {
    const b = p.buttons.map(x => x.pressed), down = i => b[i] && !prev[i];
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    const held = (b[12] || ay < -.6) ? [0, -1] : (b[13] || ay > .6) ? [0, 1] : (b[14] || ax < -.6) ? [-1, 0] : (b[15] || ax > .6) ? [1, 0] : null;
    if (held && t - lastMove > 170) { move(...held); lastMove = t; }
    if (!held) lastMove = 0;
    if (down(0)) press("A"); if (down(1)) press("B"); if (down(3)) press("Y"); if (down(9)) press("MENU");
    if (down(4)) tab(-1); if (down(5)) tab(1);
    prev = b;
  }
  requestAnimationFrame(poll);
}
requestAnimationFrame(poll);

function scale() { stage.style.transform = `scale(${fit.clientWidth / 1920})`; }
new ResizeObserver(scale).observe(fit);
render(); scale();
</script>
</body>
</html>
