[package]
name = "cm-core"
description = "Console Mode 2 core logic with no UI or OS calls: config, and later the session rules."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
regex = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
