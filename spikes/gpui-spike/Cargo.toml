[package]
name = "gpui-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Phase 0 spike for Console Mode 2 Alpha: throwaway, answers "can GPUI do what the app needs on Windows?"
[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "917559da35dd4d626205da705b071c800c9c2553" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "917559da35dd4d626205da705b071c800c9c2553" }
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
rodio = "0.23"
image = "0.25"
futures = "0.3"
vigem-client = { version = "0.1", features = ["unstable_ds4"] }
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
