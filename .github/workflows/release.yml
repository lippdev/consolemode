name: Release

# Two ways to publish a release (a version with a hyphen, like 1.6.0-alpha.3, is a pre-release):
#  - Actions > Release > Run workflow on main, with the version and "publish" ticked: the tag and the
#    release are created here, from main.
#  - Push a tag like v1.3.0 (stable) or v1.3.0-beta.2 (pre-release).
# With "publish" unticked the workflow only builds and uploads the files as an artifact.
# The app's update check (UpdateService) reads these releases and looks for the
# ConsoleMode-Setup-*.exe / ConsoleMode-Portable-*.exe assets built here.
#
# "draft" (with "publish"): the release is created as a draft. Only people with write access see a draft:
# the app's update check doesn't, nothing goes to winget and the tag isn't created yet. Publishing the draft
# on GitHub creates the tag on the commit that was built, and winget.yml then sends it to winget.
#
# "legacy": a branch built next to this one (release/1.7-legacy: 1.6.2's interfaces, frozen) and attached to
# the same release as ConsoleMode-Legacy-*.exe. Those names don't start like the ones the update check and
# winget look for, so nobody is updated to Legacy.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.6.0-alpha.3). A hyphen makes it a pre-release."
        required: true
      publish:
        description: "Publish: create the tag and the GitHub release (only from main). Unticked, just build."
        type: boolean
        default: false
      draft:
        description: "Draft: with Publish, create the release as a draft (no update notice, no winget, no tag yet)."
        type: boolean
        default: false
      legacy:
        description: "Legacy: branch to build and attach as ConsoleMode-Legacy-*.exe (e.g. release/1.7-legacy). Empty: none."
        required: false
        default: ""

permissions:
  contents: write
  # The build job fetches the Legacy job's files of this same run.
  actions: read

jobs:
  # The Legacy build: the branch's own code, tests and publish script, with the version of this release.
  legacy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.legacy != ''
    runs-on: windows-latest
    steps:
      - name: Checkout the Legacy branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.legacy }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $v = $env:INPUT_VERSION.TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?$') { throw "Versão inválida: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Run tests
        shell: pwsh
        run: dotnet test tests/ConsoleMode.Tests/ConsoleMode.Tests.csproj -c Release --nologo

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build portable + installer
        shell: pwsh
        run: .\build\Publish-ConsoleMode.ps1 -Runtime x64 -Target All -Version "${{ steps.version.outputs.version }}"

      - name: Name the files Legacy
        shell: pwsh
        run: |
          Rename-Item -LiteralPath "dist/ConsoleMode-Setup-x64.exe" -NewName "ConsoleMode-Legacy-Setup-x64.exe"
          Rename-Item -LiteralPath "dist/ConsoleMode-Portable-x64.exe" -NewName "ConsoleMode-Legacy-Portable-x64.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ConsoleMode-Legacy-${{ steps.version.outputs.version }}
          path: |
            dist/ConsoleMode-Legacy-Setup-x64.exe
            dist/ConsoleMode-Legacy-Portable-x64.exe
          if-no-files-found: error

  build:
    needs: legacy
    # Without Legacy that job is skipped, and a skipped job would skip this one too.
    if: ${{ !cancelled() && (needs.legacy.result == 'success' || needs.legacy.result == 'skipped') }}
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
      draft: ${{ steps.version.outputs.draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
        run: |
          $v = if ($env:EVENT_NAME -eq "push") { $env:REF_NAME } else { $env:INPUT_VERSION }
          $v = $v.TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?$') { throw "Versão inválida: $v" }
          $publish = ($env:EVENT_NAME -eq "push") -or ($env:INPUT_PUBLISH -eq "true")
          if ($publish -and $env:EVENT_NAME -ne "push") {
            # Publishing by hand creates the tag here: only from main, and never over a tag that exists.
            if ($env:REF -ne "refs/heads/main") { throw "Só dá para publicar a partir da main (rodando em $($env:REF))." }
            if (git ls-remote --tags origin "refs/tags/v$v") { throw "A tag v$v já existe." }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$($v.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          # A draft is only for a release made here: a pushed tag is public already.
          $draft = $publish -and ($env:EVENT_NAME -ne "push") -and ($env:INPUT_DRAFT -eq "true")
          "draft=$($draft.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Prepare release notes (English, a link to the Portuguese changelog, a summary per translated changelog)
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LEGACY: ${{ github.event.inputs.legacy }}
        run: |
          function Get-Notes([string]$file) {
            $changelog = Get-Content -LiteralPath $file -Raw -Encoding utf8
            $pattern = "(?ms)^## \[$([regex]::Escape($env:VERSION))\]\r?\n(?<notes>.*?)(?=^## \[|\z)"
            $match = [regex]::Match($changelog, $pattern)
            if (-not $match.Success) { throw "$file precisa conter a seção ## [$($env:VERSION)]." }
            $notes = $match.Groups["notes"].Value.Trim()
            if ([string]::IsNullOrWhiteSpace($notes)) { throw "A seção $($env:VERSION) de $file está vazia." }
            return $notes
          }
          # Both changelogs must have the section; the Portuguese one is linked, not pasted.
          $pt = Get-Notes "CHANGELOG.md"
          $en = Get-Notes "CHANGELOG.en-US.md"
          # One hidden "<!-- summary <code>: ... -->" line per translated changelog (CHANGELOG.md is
          # pt-BR, any CHANGELOG.<code>.md another language): the update notice shows it instead
          # of the English first item (ReleaseNotes.cs). They go at the very end of the body, so
          # clients up to 1.6.x, which show the first line they find, keep showing the English one.
          function Get-FirstItem([string]$notes) {
            $item = $notes -split "\r?\n" | Where-Object { $_ -match '^\s*[-*]\s+\S' } | Select-Object -First 1
            if (-not $item) { return $null }
            return ($item -replace '^\s*[-*]\s+', '' -replace '-->', '').Trim()
          }
          $summaries = @()
          $ptItem = Get-FirstItem $pt
          if ($ptItem) { $summaries += "<!-- summary pt-BR: $ptItem -->" }
          foreach ($file in Get-ChildItem -Name -Filter "CHANGELOG.*.md" | Where-Object { $_ -ne "CHANGELOG.en-US.md" } | Sort-Object) {
            $code = $file -replace '^CHANGELOG\.|\.md$', ''
            # Optional: a translated changelog without this version's section is skipped, not fatal.
            $notes = try { Get-Notes $file } catch { Write-Host "$file sem a seção $($env:VERSION); sem resumo em $code."; $null }
            $item = if ($notes) { Get-FirstItem $notes }
            if ($item) { $summaries += "<!-- summary ${code}: $item -->" }
          }
          # English, no language headings: ReleaseNotes.cs shows its first item to every
          # language without a summary. A "(#NN)" at the end of an item becomes a link to that PR on GitHub.
          $tag = "v$($env:VERSION)"
          $releaseNotes = @(
            $en
            ""
            "### Downloads"
            ""
            # Single quotes: in double-quoted pwsh strings the backtick is an escape and the Markdown code spans vanish.
            '- **Installer:** `ConsoleMode-Setup-x64.exe` — installs the app and offers shortcuts and starting with Windows.'
            '- **Portable:** `ConsoleMode-Portable-x64.exe` — a single executable; keeps its data in the `ConsoleMode_Data` folder next to the file.'
          )
          if ($env:LEGACY) {
            $releaseNotes += @(
              ""
              "### Legacy"
              ""
              "Prefer the old interface? **Console Mode Legacy** is 1.6.2 as it was, with the Desktop and Console interfaces. It opens with the settings you already have and keeps the ones only the current version uses, so you can switch back and forth. It is frozen: no new features, no fixes, and it never offers an update. To come back, install the current version over it."
              ""
              '- **Legacy installer:** `ConsoleMode-Legacy-Setup-x64.exe`'
              '- **Legacy portable:** `ConsoleMode-Legacy-Portable-x64.exe`'
            )
          }
          $releaseNotes += @(
            ""
            "---"
            ""
            "🇧🇷 Notas em português: [CHANGELOG.md](https://github.com/lippdev/consolemode/blob/$tag/CHANGELOG.md)"
          )
          if ($summaries.Count -gt 0) { $releaseNotes += @("") + $summaries }
          $releaseNotes = $releaseNotes -join "`n"
          Set-Content -LiteralPath "release-notes.md" -Value $releaseNotes -Encoding utf8

      - name: Run tests
        shell: pwsh
        run: dotnet test tests/ConsoleMode.Tests/ConsoleMode.Tests.csproj -c Release --nologo

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build portable + installer
        shell: pwsh
        run: .\build\Publish-ConsoleMode.ps1 -Runtime x64 -Target All -Version "${{ steps.version.outputs.version }}"

      # Code signing (docs/CODE_SIGNING.md). Off until the SignPath repository variables exist:
      # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG, plus the
      # SIGNPATH_API_TOKEN secret. Only published releases are signed; each request waits for manual approval.
      - name: Upload unsigned build for signing
        id: unsigned
        if: steps.version.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ steps.version.outputs.version }}
          path: |
            dist/ConsoleMode-Setup-x64.exe
            dist/ConsoleMode-Portable-x64.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: steps.version.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signed

      - name: Use the signed files
        if: steps.version.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          foreach ($name in "ConsoleMode-Setup-x64.exe", "ConsoleMode-Portable-x64.exe") {
            $signed = Join-Path "dist-signed" $name
            if (-not (Test-Path -LiteralPath $signed)) { throw "SignPath did not return $name" }
            if ((Get-AuthenticodeSignature -LiteralPath $signed).Status -ne "Valid") { throw "$name is not validly signed" }
            Copy-Item -LiteralPath $signed -Destination (Join-Path "dist" $name) -Force
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ConsoleMode-${{ steps.version.outputs.version }}
          path: |
            dist/ConsoleMode-Setup-x64.exe
            dist/ConsoleMode-Portable-x64.exe
          if-no-files-found: error

      # The Legacy job's files of this run, next to the ones built here.
      - name: Fetch the Legacy build
        id: legacy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.legacy != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "ConsoleMode-Legacy-$($env:VERSION)" --dir dist
          foreach ($name in "ConsoleMode-Legacy-Setup-x64.exe", "ConsoleMode-Legacy-Portable-x64.exe") {
            if (-not (Test-Path -LiteralPath (Join-Path "dist" $name))) { throw "The Legacy build did not bring $name" }
          }
          # A multi-line value for the release step below.
          "files<<LIST" >> $env:GITHUB_OUTPUT
          "dist/ConsoleMode-Legacy-Setup-x64.exe" >> $env:GITHUB_OUTPUT
          "dist/ConsoleMode-Legacy-Portable-x64.exe" >> $env:GITHUB_OUTPUT
          "LIST" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          # Pushed tag: it already exists. Run by hand: it is created here, on the commit that was built
          # (for a draft, when the draft is published).
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Console Mode ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          draft: ${{ steps.version.outputs.draft }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          append_body: false
          body_path: release-notes.md
          files: |
            dist/ConsoleMode-Setup-x64.exe
            dist/ConsoleMode-Portable-x64.exe
            ${{ steps.legacy.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Opens the update PR on microsoft/winget-pkgs for stable releases (pre-releases and drafts are skipped;
  # a draft goes to winget when it is published, through winget.yml).
  # Off until the WINGET_TOKEN secret exists: a classic PAT with the public_repo scope, from the
  # account that owns the lippdev/winget-pkgs fork.
  winget:
    needs: build
    # "!cancelled()": the build job may have a skipped job (Legacy) before it.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.publish == 'true' && needs.build.outputs.prerelease == 'false' && needs.build.outputs.draft != 'true' }}
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: lippdev.ConsoleMode
          release-tag: v${{ needs.build.outputs.version }}
          installers-regex: 'ConsoleMode-Setup-x64\.exe$'
          fork-user: lippdev
          token: ${{ env.WINGET_TOKEN }}
