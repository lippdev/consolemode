name: Release

# Two ways to publish a release (a version with a hyphen, like 1.6.0-alpha.3, is a pre-release):
#  - Actions > Release > Run workflow on main, with the version and "publish" ticked: the tag and the
#    release are created here, from main.
#  - Push a tag like v1.3.0 (stable) or v1.3.0-beta.2 (pre-release).
# With "publish" unticked the workflow only builds and uploads the files as an artifact.
# The app's update check (UpdateService) reads these releases and looks for the
# ConsoleMode-Setup-*.exe / ConsoleMode-Portable-*.exe assets built here.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.6.0-alpha.3). A hyphen makes it a pre-release."
        required: true
      publish:
        description: "Publish: create the tag and the GitHub release (only from main). Unticked, just build."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          $v = if ($env:EVENT_NAME -eq "push") { $env:REF_NAME } else { $env:INPUT_VERSION }
          $v = $v.TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?$') { throw "Versão inválida: $v" }
          $publish = ($env:EVENT_NAME -eq "push") -or ($env:INPUT_PUBLISH -eq "true")
          if ($publish -and $env:EVENT_NAME -ne "push") {
            # Publishing by hand creates the tag here: only from main, and never over a tag that exists.
            if ($env:REF -ne "refs/heads/main") { throw "Só dá para publicar a partir da main (rodando em $($env:REF))." }
            if (git ls-remote --tags origin "refs/tags/v$v") { throw "A tag v$v já existe." }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$($v.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Prepare release notes (English, a link to the Portuguese changelog, a summary per translated changelog)
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          function Get-Notes([string]$file) {
            $changelog = Get-Content -LiteralPath $file -Raw -Encoding utf8
            $pattern = "(?ms)^## \[$([regex]::Escape($env:VERSION))\]\r?\n(?<notes>.*?)(?=^## \[|\z)"
            $match = [regex]::Match($changelog, $pattern)
            if (-not $match.Success) { throw "$file precisa conter a seção ## [$($env:VERSION)]." }
            $notes = $match.Groups["notes"].Value.Trim()
            if ([string]::IsNullOrWhiteSpace($notes)) { throw "A seção $($env:VERSION) de $file está vazia." }
            return $notes
          }
          # Both changelogs must have the section; the Portuguese one is linked, not pasted.
          $pt = Get-Notes "CHANGELOG.md"
          $en = Get-Notes "CHANGELOG.en-US.md"
          # One hidden "<!-- summary <code>: ... -->" line per translated changelog (CHANGELOG.md is
          # pt-BR, any CHANGELOG.<code>.md another language): the update notice shows it instead
          # of the English first item (ReleaseNotes.cs). They go at the very end of the body, so
          # clients up to 1.6.x, which show the first line they find, keep showing the English one.
          function Get-FirstItem([string]$notes) {
            $item = $notes -split "\r?\n" | Where-Object { $_ -match '^\s*[-*]\s+\S' } | Select-Object -First 1
            if (-not $item) { return $null }
            return ($item -replace '^\s*[-*]\s+', '' -replace '-->', '').Trim()
          }
          $summaries = @()
          $ptItem = Get-FirstItem $pt
          if ($ptItem) { $summaries += "<!-- summary pt-BR: $ptItem -->" }
          foreach ($file in Get-ChildItem -Name -Filter "CHANGELOG.*.md" | Where-Object { $_ -ne "CHANGELOG.en-US.md" } | Sort-Object) {
            $code = $file -replace '^CHANGELOG\.|\.md$', ''
            # Optional: a translated changelog without this version's section is skipped, not fatal.
            $notes = try { Get-Notes $file } catch { Write-Host "$file sem a seção $($env:VERSION); sem resumo em $code."; $null }
            $item = if ($notes) { Get-FirstItem $notes }
            if ($item) { $summaries += "<!-- summary ${code}: $item -->" }
          }
          # English, no language headings: ReleaseNotes.cs shows its first item to every
          # language without a summary. A "(#NN)" at the end of an item becomes a link to that PR on GitHub.
          $tag = "v$($env:VERSION)"
          $releaseNotes = @(
            $en
            ""
            "### Downloads"
            ""
            # Single quotes: in double-quoted pwsh strings the backtick is an escape and the Markdown code spans vanish.
            '- **Installer:** `ConsoleMode-Setup-x64.exe` — installs the app and offers shortcuts and starting with Windows.'
            '- **Portable:** `ConsoleMode-Portable-x64.exe` — a single executable; keeps its data in the `ConsoleMode_Data` folder next to the file.'
            ""
            "---"
            ""
            "🇧🇷 Notas em português: [CHANGELOG.md](https://github.com/lippdev/consolemode/blob/$tag/CHANGELOG.md)"
          )
          if ($summaries.Count -gt 0) { $releaseNotes += @("") + $summaries }
          $releaseNotes = $releaseNotes -join "`n"
          Set-Content -LiteralPath "release-notes.md" -Value $releaseNotes -Encoding utf8

      - name: Run tests
        shell: pwsh
        run: dotnet test tests/ConsoleMode.Tests/ConsoleMode.Tests.csproj -c Release --nologo

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build portable + installer
        shell: pwsh
        run: .\build\Publish-ConsoleMode.ps1 -Runtime x64 -Target All -Version "${{ steps.version.outputs.version }}"

      # Code signing (docs/CODE_SIGNING.md). Off until the SignPath repository variables exist:
      # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG, plus the
      # SIGNPATH_API_TOKEN secret. Only published releases are signed; each request waits for manual approval.
      - name: Upload unsigned build for signing
        id: unsigned
        if: steps.version.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ steps.version.outputs.version }}
          path: |
            dist/ConsoleMode-Setup-x64.exe
            dist/ConsoleMode-Portable-x64.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: steps.version.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signed

      - name: Use the signed files
        if: steps.version.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          foreach ($name in "ConsoleMode-Setup-x64.exe", "ConsoleMode-Portable-x64.exe") {
            $signed = Join-Path "dist-signed" $name
            if (-not (Test-Path -LiteralPath $signed)) { throw "SignPath did not return $name" }
            if ((Get-AuthenticodeSignature -LiteralPath $signed).Status -ne "Valid") { throw "$name is not validly signed" }
            Copy-Item -LiteralPath $signed -Destination (Join-Path "dist" $name) -Force
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ConsoleMode-${{ steps.version.outputs.version }}
          path: |
            dist/ConsoleMode-Setup-x64.exe
            dist/ConsoleMode-Portable-x64.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          # Pushed tag: it already exists. Run by hand: it is created here, on the commit that was built.
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Console Mode ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          append_body: false
          body_path: release-notes.md
          files: |
            dist/ConsoleMode-Setup-x64.exe
            dist/ConsoleMode-Portable-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Opens the update PR on microsoft/winget-pkgs for stable releases (pre-releases are skipped).
  # Off until the WINGET_TOKEN secret exists: a classic PAT with the public_repo scope, from the
  # account that owns the lippdev/winget-pkgs fork.
  winget:
    needs: build
    if: needs.build.outputs.publish == 'true' && needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: lippdev.ConsoleMode
          release-tag: v${{ needs.build.outputs.version }}
          installers-regex: 'ConsoleMode-Setup-x64\.exe$'
          fork-user: lippdev
          token: ${{ env.WINGET_TOKEN }}
